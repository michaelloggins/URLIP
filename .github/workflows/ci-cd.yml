# URLIP CI/CD Pipeline
# Automated testing and deployment to Azure Functions
#
# Required GitHub Secrets:
#   AZURE_CLIENT_ID        - Azure AD Application (Service Principal) Client ID
#   AZURE_TENANT_ID        - Azure AD Tenant ID
#   AZURE_SUBSCRIPTION_ID  - Azure Subscription ID
#   AZURE_FUNCTIONAPP_NAME_DEV  - Development Function App name (urlip-dev-func)
#   AZURE_FUNCTIONAPP_NAME_PROD - Production Function App name (urlip-prod-func)
#
# Setup Instructions: See docs/runbooks/deployment.md

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'release/*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production

permissions:
  id-token: write   # Required for OIDC authentication
  contents: read           # Required to checkout code
  security-events: write   # Required for CodeQL SARIF upload

env:
  NODE_VERSION: '18.x'
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'

jobs:
  # ============================================
  # Build and Test
  # ============================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint
        continue-on-error: true

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration
        continue-on-error: true

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-app
          path: |
            .
            !node_modules
            !.git
            !.github
            !coverage
            !tests
          retention-days: 1

  # ============================================
  # Security Scanning
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ============================================
  # Deploy to Development
  # ============================================
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: development
      url: https://urlip-dev-func.azurewebsites.net

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: function-app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install production dependencies
        run: npm ci --production

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions (Development)
        uses: azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME_DEV }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      - name: Health check
        continue-on-error: true  # Soft-fail until Azure resources are provisioned
        run: |
          sleep 30
          curl -f https://${{ secrets.AZURE_FUNCTIONAPP_NAME_DEV }}.azurewebsites.net/api/health || echo "Health check failed - Azure resources may not be provisioned yet"

  # ============================================
  # Deploy to Production
  # ============================================
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: startsWith(github.ref, 'refs/heads/release/')
    environment:
      name: production
      url: https://urlip-prod-func.azurewebsites.net

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: function-app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install production dependencies
        run: npm ci --production

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions (Production)
        uses: azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME_PROD }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      - name: Health check
        continue-on-error: true  # Soft-fail until Azure resources are provisioned
        run: |
          sleep 30
          curl -f https://${{ secrets.AZURE_FUNCTIONAPP_NAME_PROD }}.azurewebsites.net/api/health || echo "Health check failed - Azure resources may not be provisioned yet"

      - name: Notify deployment success
        if: success()
        run: echo "Production deployment successful!"
